name: CI — build + testes
on:
  push:
    branches: [main, fix/production-readiness]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: w2talent_test
          POSTGRES_USER: w2talent
          POSTGRES_PASSWORD: isolated_ci_password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U w2talent -d w2talent_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://w2talent:isolated_ci_password@localhost:5432/w2talent_test
      JWT_SECRET: test-only-isolated-ci-jwt-secret-32-bytes
      CRON_SECRET: test-only-isolated-ci-cron-secret-32-bytes
      WEBHOOK_SECRET: test-only-isolated-ci-webhook-secret-32-bytes
      NEXT_PUBLIC_BASE_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma migrate deploy
      - run: npm test -- --runInBand
      - run: npm run build
      - name: Dependency audit report
        if: always()
        run: npm audit --omit=dev
